<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Q-OPSEC Orchestrator Dashboard</title>
  <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0f1a;
      color: #e5e7eb;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .app {
      flex-grow: 1;
      background: radial-gradient(1000px 600px at 10% 10%, #1c1f2e 0%, #0d0f1a 60%);
      display: flex;
      flex-direction: column;
    }
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(13,15,26,0.85);
      backdrop-filter: saturate(180%) blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .brand h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.2px;
      background: linear-gradient(135deg, #8ab4ff, #86efac);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      user-select: none;
    }
    .actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .btn {
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-weight: 700;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease;
      color: #e5e7eb;
      user-select: none;
      white-space: nowrap;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-green {
      background-color: #10b98133;
      border-color: #10b98166;
    }
    .btn-green:hover:not(:disabled) {
      background-color: #10b98155;
    }
    .btn-red {
      background-color: #ef444433;
      border-color: #ef444466;
    }
    .btn-red:hover:not(:disabled) {
      background-color: #ef444455;
    }
    .btn-ghost {
      background-color: transparent;
      border-color: #ffff33;
      color: #a5b4fc;
    }
    .btn-ghost:hover:not(:disabled) {
      background-color: #ffff1a;
      color: #e0e7ff;
    }
    .tabs {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 1.5rem;
      display: flex;
      gap: 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      user-select: none;
    }
    .tab {
      background: transparent;
      border: none;
      color: #9ca3af;
      padding: 0.75rem 1rem;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      font-weight: 700;
      font-size: 1rem;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .tab:hover {
      color: #93c5fd;
    }
    .tab.active {
      color: #93c5fd;
      border-bottom-color: #93c5fd;
    }
    main.container {
      max-width: 1280px;
      margin: 1.5rem auto;
      padding: 0 1.5rem;
      flex-grow: 1;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
    }
    .card {
      background: #111425;
      border: 1px solid #1f233a;
      border-radius: 0.75rem;
      padding: 1rem;
      transition: border-color 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card:hover {
      border-color: #3b82f6;
    }
    .service-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .service-name {
      font-weight: 700;
      font-size: 1.125rem;
      color: #e0e7ff;
    }
    .badge {
      font-size: 0.75rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      border: 1px solid;
      user-select: none;
      white-space: nowrap;
    }
    .badge.ok {
      color: #10b981;
      background: #10b98133;
      border-color: #10b98155;
    }
    .badge.off {
      color: #6b7280;
      background: #6b728033;
      border-color: #6b728055;
    }
    .meta {
      font-size: 0.75rem;
      color: #9ca3af;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }
    .btn-sm {
      padding: 0.4rem 0.75rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      border: 1px solid #2a2f4a;
      background: #161a2f;
      color: #cbd5e1;
      transition: background-color 0.2s ease;
      cursor: pointer;
      user-select: none;
    }
    .btn-sm:hover:not(:disabled) {
      background: #1b2040;
    }
    .btn-sm:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .panel {
      background: #0f1328;
      border: 1px solid #1f233a;
      border-radius: 0.75rem;
      padding: 1rem;
      margin-top: 1rem;
    }
    .search {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .input, textarea {
      font-family: monospace;
      font-size: 0.9rem;
      background: #0b0e1f;
      border: 1px solid #242847;
      color: #e5e7eb;
      border-radius: 0.5rem;
      padding: 0.5rem 0.75rem;
      width: 100%;
      resize: vertical;
      transition: border-color 0.2s ease;
    }
    .input:focus, textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px #3b82f633;
    }
    .mono {
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.875rem;
      color: #d1d5db;
    }
    .logs {
      max-height: 60vh;
      background: #0b0e1f;
      border: 1px solid #242847;
      border-radius: 0.5rem;
      padding: 1rem;
      font-family: monospace;
      font-size: 0.875rem;
      color: #d1d5db;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .log {
      padding: 0.25rem 0;
      border-bottom: 1px dashed #1d2240;
    }
    .log:last-child {
      border-bottom: none;
    }
    .note {
      font-size: 0.75rem;
      color: #9ca3af;
      user-select: none;
    }
    .notif {
      position: fixed;
      right: 1rem;
      top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      border: 1px solid;
      user-select: none;
      z-index: 1000;
      max-width: 320px;
      word-break: break-word;
    }
    .notif.ok {
      background: #052e26;
      color: #86efac;
      border-color: #10b98155;
    }
    .notif.err {
      background: #3a0b0b;
      color: #fecaca;
      border-color: #ef444455;
    }
    .service-footer {
      margin-top: 1rem;
      padding-top: 0.75rem;
      border-top: 1px solid rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .footer-link {
      font-size: 0.75rem;
      color: #3b82f6;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }
    .footer-link:hover {
      text-decoration: underline;
      color: #60a5fa;
    }
    .footer-text {
      font-size: 0.7rem;
      color: #6b7280;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SERVICES_WITH_METRICS = ['risk_service', 'confiability_service', 'classification_agent'];
    const SWAGGER_IP = '192.168.18.18';

    function ImageCarousel({ images, basePath }) {
      const [currentIndex, setCurrentIndex] = React.useState(0);
      if (!images || images.length === 0) return <p>No images available.</p>;
      const prev = () => setCurrentIndex((currentIndex - 1 + images.length) % images.length);
      const next = () => setCurrentIndex((currentIndex + 1) % images.length);
      const currentImage = images[currentIndex];
      const imageUrl = `${basePath}/${currentImage}`;
      return (
        <div style={{ textAlign: 'center' }}>
          <div style={{ marginBottom: '0.5rem' }}>
            <button className="btn btn-ghost" onClick={prev}>←</button>
            <span style={{ margin: '0 1rem' }}>{currentIndex + 1} / {images.length}</span>
            <button className="btn btn-ghost" onClick={next}>→</button>
          </div>
          <img
            src={imageUrl}
            alt={currentImage}
            style={{ maxHeight: '400px', maxWidth: '100%', borderRadius: '0.5rem', cursor: 'pointer' }}
            onClick={() => window.open(imageUrl, '_blank')}
          />
        </div>
      );
    }

    function App() {
      const [services, setServices] = useState([]);
      const [activeTab, setActiveTab] = useState('services');
      const [loading, setLoading] = useState(false);
      const [notif, setNotif] = useState(null);
      const [selectedService, setSelectedService] = useState(null);
      const [logs, setLogs] = useState([]);
      const [requestId, setRequestId] = useState('');
      const [activeRequests, setActiveRequests] = useState([]);
      const [metricsService, setMetricsService] = useState(SERVICES_WITH_METRICS[0]);
      const [metricsSessions, setMetricsSessions] = useState([]);
      const [selectedSession, setSelectedSession] = useState(null);
      const [sessionImages, setSessionImages] = useState([]);
      const [datasets, setDatasets] = useState([]);
      const [selectedDataset, setSelectedDataset] = useState(null);
      const [datasetPreview, setDatasetPreview] = useState(null);
      const [datasetsService, setDatasetsService] = useState(SERVICES_WITH_METRICS[0]);
      const [serviceConfigs, setServiceConfigs] = useState({});
      const [pipelineResults, setPipelineResults] = useState(null);
      const [pipelineRequestId, setPipelineRequestId] = useState('req-phd-' + Math.floor(Math.random()*1000));
      const [pipelineSource, setPipelineSource] = useState('agent-wsl-01');
      const [pipelineOriginUrl, setPipelineOriginUrl] = useState('http://192.168.18.18:8090/callback');
      const [proposedAlgs, setProposedAlgs] = useState(['Kyber768', 'AES256_GCM']);
      const [pipelineData, setPipelineData] = useState('{\n  "message": "Secure PhD Data Transmission",\n  "researcher": "Darlan Noetzold"\n}');

      const ALL_ALGS = {
        classical: ['AES256_GCM', 'AES128_GCM', 'ChaCha20_Poly1305', 'RSA2048', 'RSA4096', 'ECDH_P256', 'ECDH_P384', 'ECDH_P521', '3DES', 'Blowfish'],
        pqc_kem: ['Kyber512', 'Kyber768', 'Kyber1024', 'FrodoKEM-640-AES', 'FrodoKEM-976-AES', 'FrodoKEM-1344-AES', 'BIKE-L1', 'BIKE-L3', 'BIKE-L5', 'HQC-128', 'HQC-192', 'HQC-256', 'Saber', 'LightSaber', 'FireSaber'],
        pqc_sig: ['Dilithium2', 'Dilithium3', 'Dilithium5', 'Falcon-512', 'Falcon-1024', 'SPHINCS+-SHA256-128s-simple'],
        qkd: ['QKD_BB84', 'QKD_E91', 'QKD_MDI', 'QKD_CV', 'QKD_SARG04', 'QKD_DecoyState', 'QKD_DI']
      };

      const API = window.location.origin;

      const toast = (msg, type='ok') => {
        setNotif({ msg, type });
        setTimeout(() => setNotif(null), 3000);
      };

      const fetchServices = async () => {
        try {
          const r = await fetch(API + '/services');
          const data = await r.json();
          setServices(data);
          setServiceConfigs(prev => {
            const newConfigs = {...prev};
            for (const s of data) {
              if (!newConfigs[s.name]) {
                newConfigs[s.name] = {
                  start: s.start ? JSON.stringify(s.start, null, 2) : '[]',
                  cwd: s.cwd || ''
                };
              }
            }
            return newConfigs;
          });
        } catch (e) { toast('Failed to load services', 'err'); }
      };

      useEffect(() => {
        fetchServices();
        const t = setInterval(fetchServices, 5000);
        return () => clearInterval(t);
      }, []);

      const runPipeline = async (bodyOverride) => {
        setLoading(true);
        try {
          const body = bodyOverride || {
            request_id: pipelineRequestId,
            source: pipelineSource,
            destination: 'server-backend',
            proposed: proposedAlgs,
            originUrl: pipelineOriginUrl,
            data: JSON.parse(pipelineData)
          };
          const r = await fetch(API + '/run-pipeline', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          const data = await r.json();
          setPipelineResults(data);
          toast("Pipeline executed", "ok");
        } catch (err) { toast("Pipeline failed: " + err.message, "err"); }
        setLoading(false);
      };

      const startAll = async () => {
        setLoading(true);
        try { await fetch(API + '/start/all', { method: 'POST' }); toast('All started'); }
        catch { toast('Error starting all', 'err'); }
        setLoading(false); fetchServices();
      };

      const stopAll = async () => {
        setLoading(true);
        try { await fetch(API + '/stop/all', { method: 'POST' }); toast('All stopped'); }
        catch { toast('Error stopping all', 'err'); }
        setLoading(false); fetchServices();
      };

      const startService = async (name) => {
        setLoading(true);
        try { await fetch(`${API}/services/${name}/start`, { method: 'POST' }); toast(`${name} started`); }
        catch { toast(`Error starting ${name}`, 'err'); }
        setLoading(false); fetchServices();
      };

      const stopService = async (name) => {
        setLoading(true);
        try { await fetch(`${API}/services/${name}/stop`, { method: 'POST' }); toast(`${name} stopped`); }
        catch { toast(`Error stopping ${name}`, 'err'); }
        setLoading(false); fetchServices();
      };

      const restartService = async (name) => {
        setLoading(true);
        try { await fetch(`${API}/services/${name}/restart`, { method: 'POST' }); toast(`${name} restarted`); }
        catch { toast(`Error restarting ${name}`, 'err'); }
        setLoading(false); fetchServices();
      };

      const viewLogs = async (name) => {
        setActiveTab('logs');
        setSelectedService(name);
        try {
          const r = await fetch(`${API}/services/${name}/logs?lines=600`);
          const data = await r.json();
          setLogs(data.tail || []);
        } catch { toast(`Error loading logs for ${name}`, 'err'); }
      };

      const saveServiceConfig = async (serviceName) => {
        if (!serviceConfigs[serviceName]) return;
        let startCmd;
        try {
          startCmd = JSON.parse(serviceConfigs[serviceName].start);
          if (!Array.isArray(startCmd)) throw new Error('Start command must be a JSON array');
        } catch (err) { return toast(`Invalid JSON: ${err.message}`, 'err'); }
        try {
          const r = await fetch(`${API}/services/${serviceName}/config`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ start: startCmd, cwd: serviceConfigs[serviceName].cwd || undefined }),
          });
          if (r.ok) toast(`Config saved for ${serviceName}`);
          else toast(`Failed to save config for ${serviceName}`, 'err');
        } catch { toast(`Error saving config for ${serviceName}`, 'err'); }
      };

      const loadActiveReqs = async () => {
        setActiveTab('active');
        try {
          const r = await fetch(`${API}/requests/active`);
          const data = await r.json();
          setActiveRequests(data.active_request_ids || []);
        } catch { toast('Error listing requests', 'err'); }
      };

      const loadMetricsSessions = async (service) => {
        setSelectedSession(null);
        setSessionImages([]);
        try {
          const r = await fetch(`${API}/metrics/${service}/sessions`);
          const data = await r.json();
          let sessions = service === 'classification_agent' ? (data.sessions || []).map(s => ({ session_id: s })) : (data.sessions || []);
          setMetricsSessions(sessions);
        } catch { toast('Error loading sessions', 'err'); }
      };

      const loadSessionDetail = async (service, session) => {
        const sessionId = typeof session === 'string' ? session : session.session_id;
        setSelectedSession(session);
        try {
          const r = await fetch(`${API}/metrics/${service}/sessions/${sessionId}`);
          const data = await r.json();
          if (service === 'classification_agent') {
            const rImg = await fetch(`${API}/metrics/${service}/images`);
            const dImg = await rImg.json();
            setSessionImages(dImg.available_images || []);
          } else {
            setSessionImages(data.available_images || []);
          }
        } catch { toast('Error loading details', 'err'); }
      };

      const loadDatasets = async (service) => {
        setSelectedDataset(null);
        setDatasetPreview(null);
        try {
          const r = await fetch(`${API}/datasets/${service}`);
          const data = await r.json();
          setDatasets(service === 'classification_agent' ? (data || []) : (data.datasets || []));
        } catch { toast('Error loading datasets', 'err'); }
      };

      const loadDatasetPreview = async (service, dsName, fName) => {
        setSelectedDataset({ dsName, fName });
        try {
          const r = await fetch(`${API}/datasets/${service}/${dsName}/preview?file=${fName}&n=20`);
          const data = await r.json();
          setDatasetPreview(data);
        } catch { toast('Error loading preview', 'err'); }
      };

      const ServiceCard = ({ s }) => {
        const config = serviceConfigs[s.name] || { start: '[]', cwd: '' };
        return (
          <div className="card">
            <div className="service-header">
              <div>
                <div className="service-name">{s.name}</div>
                <span className={`badge ${s.running ? 'ok' : 'off'}`}>{s.running ? 'RUNNING' : 'STOPPED'}</span>
              </div>
              <div className="meta">
                <div>Port: {s.port || '-'}</div>
                <div>PID: {s.pid || '-'}</div>
              </div>
            </div>
            <div>
              <textarea className="input" rows={2} value={config.start} onChange={e => setServiceConfigs({...serviceConfigs, [s.name]: {...config, start: e.target.value}})} />
              <input type="text" className="input" style={{marginTop:4}} value={config.cwd} onChange={e => setServiceConfigs({...serviceConfigs, [s.name]: {...config, cwd: e.target.value}})} placeholder="cwd" />
            </div>
            <div className="row">
              <button className="btn-sm" onClick={() => startService(s.name)} disabled={s.running}>Start</button>
              <button className="btn-sm" onClick={() => stopService(s.name)} disabled={!s.running}>Stop</button>
              <button className="btn-sm" onClick={() => restartService(s.name)}>Restart</button>
              <button className="btn-sm" onClick={() => viewLogs(s.name)}>Logs</button>
              <button className="btn-sm" onClick={() => saveServiceConfig(s.name)}>Save</button>
            </div>
          </div>
        );
      };

      return (
        <div className="app">
          <header className="header">
            <div className="brand"><h1>🔐 Q-OPSEC Orchestrator</h1></div>
            <div className="actions">
              <button className="btn btn-green" onClick={startAll}>▶ Start All</button>
              <button className="btn btn-red" onClick={stopAll}>■ Stop All</button>
              <button className="btn btn-ghost" onClick={fetchServices}>↻ Refresh</button>
            </div>
          </header>

          <nav className="tabs">
            {['services', 'pipeline', 'active', 'logs', 'metrics', 'datasets'].map(t => (
              <button key={t} className={`tab ${activeTab === t ? 'active' : ''}`} onClick={() => {
                setActiveTab(t);
                if(t === 'metrics') loadMetricsSessions(metricsService);
                if(t === 'datasets') loadDatasets(datasetsService);
              }}>{t.toUpperCase()}</button>
            ))}
          </nav>

          <main className="container">
            {activeTab === 'services' && (
              <div className="grid">{services.map(s => <ServiceCard key={s.name} s={s} />)}</div>
            )}

            {activeTab === 'pipeline' && (
              <section>
                <div style={{display: 'grid', gridTemplateColumns: '1fr 1.5fr', gap: '1.5rem'}}>
                  <div className="panel">
                    <h2 style={{fontSize:'1.1rem', marginBottom:'1rem'}}>Pipeline Architect</h2>
                    <input type="text" className="input" value={pipelineRequestId} onChange={e => setPipelineRequestId(e.target.value)} placeholder="Req ID" style={{marginBottom:8}} />
                    <textarea className="input" style={{height: 100}} value={pipelineData} onChange={e => setPipelineData(e.target.value)} />
                    <div style={{marginTop:10}}>
                      {Object.entries(ALL_ALGS).map(([cat, algs]) => (
                        <div key={cat} style={{marginBottom:10}}>
                          <div style={{fontSize:'0.7rem', color:'#6366f1'}}>{cat.toUpperCase()}</div>
                          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:4}}>
                            {algs.map(alg => (
                              <label key={alg} style={{fontSize:'0.75rem'}}>
                                <input type="checkbox" checked={proposedAlgs.includes(alg)} onChange={() => setProposedAlgs(prev => prev.includes(alg) ? prev.filter(a => a !== alg) : [...prev, alg])} /> {alg}
                              </label>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                    <button className="btn btn-green" style={{width:'100%', marginTop:15}} onClick={() => runPipeline()} disabled={loading}>EXECUTE PIPELINE</button>
                  </div>

                  <div className="panel">
                    <h2 style={{fontSize:'1.1rem', marginBottom:'1rem'}}>Execution Evidence</h2>
                    {!pipelineResults ? <p>Waiting for trigger...</p> : (
                      <div>
                        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginBottom:15}}>
                          <div style={{background:'#1e293b', padding:10, borderRadius:8}}>
                            <div style={{fontSize:'0.6rem'}}>ALGO</div>
                            <div style={{color:'#34d399'}}>{pipelineResults.final_data?.selectedAlgorithm || 'N/A'}</div>
                          </div>
                        </div>
                        <div style={{background:'#020617', padding:10, borderRadius:8}}>
                          {(pipelineResults.pipeline_results || []).map((step, i) => (
                            <div key={i} style={{fontSize:'0.8rem', borderBottom:'1px solid #1e293b', padding:'5px 0'}}>
                              <span>{i+1}. {step.service.toUpperCase()}</span> - <span style={{color: step.status === 'success' ? '#10b981' : '#f43f5e'}}>{step.status}</span>
                            </div>
                          ))}
                        </div>
                        <pre style={{marginTop:15, fontSize:'0.65rem', background:'#070912', padding:10, borderRadius:6, maxHeight:200, overflow:'auto'}}>
                          {JSON.stringify(pipelineResults.final_data, null, 2)}
                        </pre>
                      </div>
                    )}
                  </div>
                </div>
              </section>
            )}

            {activeTab === 'metrics' && (
              <section>
                <select value={metricsService} onChange={e => {setMetricsService(e.target.value); loadMetricsSessions(e.target.value);}}>
                  {SERVICES_WITH_METRICS.map(s => <option key={s} value={s}>{s}</option>)}
                </select>
                {!selectedSession ? (
                  <div className="grid" style={{marginTop:15}}>
                    {metricsSessions.map(s => <div key={s.session_id} className="card" onClick={() => loadSessionDetail(metricsService, s)} style={{cursor:'pointer'}}>{s.session_id}</div>)}
                  </div>
                ) : (
                  <div>
                    <button onClick={() => setSelectedSession(null)}>Back</button>
                    <ImageCarousel images={sessionImages} basePath={`/metrics/${metricsService}/sessions/${selectedSession.session_id}`} />
                  </div>
                )}
              </section>
            )}

            {activeTab === 'datasets' && (
              <section>
                <select value={datasetsService} onChange={e => {setDatasetsService(e.target.value); loadDatasets(e.target.value);}}>
                  {SERVICES_WITH_METRICS.map(s => <option key={s} value={s}>{s}</option>)}
                </select>
                <div className="grid" style={{marginTop:15}}>
                  {datasets.map(ds => <div key={ds.name} className="card">{ds.name}</div>)}
                </div>
              </section>
            )}

            {activeTab === 'logs' && (
              <section>
                <div style={{display:'flex', justifyContent:'space-between', marginBottom:10}}>
                  <h2>{selectedService || 'Select Service'}</h2>
                  <button onClick={() => viewLogs(selectedService)}>Refresh</button>
                </div>
                <div className="logs">{logs.map((l, i) => <div key={i}>{l}</div>)}</div>
              </section>
            )}

            {activeTab === 'active' && (
              <section>
                <div className="grid">{activeRequests.map(id => <div key={id} className="card">{id}</div>)}</div>
              </section>
            )}
          </main>

          {notif && <div className={`notif ${notif.type}`}>{notif.msg}</div>}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
