spring.application.name=context_api

server.port=65534

management.endpoints.web.exposure.include=*
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

spring.datasource.url=jdbc:postgresql://localhost:5432/context_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# RabbitMQ do Ambiente Q-OPSEC (via docker, mapa 127.0.0.1:5673->5672).
# O context_api usa somente o starter (health indicator); o broker NUNCA foi
# configurado aqui, por isso o /actuator/health ficava DOWN (tentava localhost:5672).
# Host/porta fixos; credenciais vem de variaveis de ambiente (nunca versionadas),
# resolvidas na ordem: SPRING_RABBITMQ_* -> QOPSEC_RABBITMQ_* (exportadas pelo wrapper
# do orquestrador) -> fallback admin/admin (dev local apenas; 401 se o broker real).
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5673}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:${QOPSEC_RABBITMQ_USER:admin}}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:${QOPSEC_RABBITMQ_PASSWORD:admin}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true


springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.syntaxHighlight.activated=true
springdoc.packages-to-scan=tech.noetzold.context_api
springdoc.show-actuator=true