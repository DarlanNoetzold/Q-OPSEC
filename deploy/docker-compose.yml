name: qopsec

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7.4.3
    environment:
      REDIS_PASSWORD: ${QOPSEC_REDIS_PASSWORD:?set QOPSEC_REDIS_PASSWORD}
    command: >
      sh -c 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD" --maxmemory-policy allkeys-lru'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${QOPSEC_RABBITMQ_USER:?set QOPSEC_RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${QOPSEC_RABBITMQ_PASSWORD:?set QOPSEC_RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  kms:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.kms
    environment:
      QOPSEC_KMS_SESSION_BACKEND: redis
      QOPSEC_REDIS_URL: redis://:${QOPSEC_REDIS_PASSWORD}@redis:6379/0
      QOPSEC_TRACING_ENABLED: ${QOPSEC_TRACING_ENABLED:-auto}
      QOPSEC_OTLP_ENDPOINT: ${QOPSEC_OTLP_ENDPOINT:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8002/health"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  orchestrator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.orchestrator
    environment:
      QOPSEC_REDIS_URL: redis://:${QOPSEC_REDIS_PASSWORD}@redis:6379/0
      QOPSEC_RABBITMQ_URL: amqp://${QOPSEC_RABBITMQ_USER}:${QOPSEC_RABBITMQ_PASSWORD}@rabbitmq:5672/
      QOPSEC_RATE_LIMIT_REQUESTS: ${QOPSEC_RATE_LIMIT_REQUESTS:-600}
      QOPSEC_RATE_LIMIT_WINDOW_SECONDS: ${QOPSEC_RATE_LIMIT_WINDOW_SECONDS:-60}
      QOPSEC_PIPELINE_IDEMPOTENCY_TTL_SECONDS: ${QOPSEC_PIPELINE_IDEMPOTENCY_TTL_SECONDS:-86400}
      QOPSEC_TRACING_ENABLED: ${QOPSEC_TRACING_ENABLED:-auto}
      QOPSEC_OTLP_ENDPOINT: ${QOPSEC_OTLP_ENDPOINT:-}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/architecture/status"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ../monitoring/prometheus.compose.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SERVER_HTTP_PORT: "3000"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    logging: *default-logging

volumes:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
