apiVersion: apps/v1
kind: Deployment
metadata:
  name: qopsec-kms
  namespace: qopsec
  labels:
    app.kubernetes.io/name: qopsec-kms
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qopsec-kms
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qopsec-kms
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: qopsec-kms
      containers:
        - name: kms
          image: ghcr.io/darlannoetzold/qopsec-kms:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
          envFrom:
            - configMapRef:
                name: qopsec-config
            - secretRef:
                name: qopsec-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: qopsec-kms
  namespace: qopsec
  labels:
    app.kubernetes.io/name: qopsec-kms
spec:
  selector:
    app.kubernetes.io/name: qopsec-kms
  ports:
    - name: http
      port: 8002
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: qopsec-kms
  namespace: qopsec
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: qopsec-kms
  minReplicas: 2
  maxReplicas: 20
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: qopsec-kms
  namespace: qopsec
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qopsec-kms
