apiVersion: v1
kind: Service
metadata:
  name: qopsec-rabbitmq
  namespace: qopsec
  labels:
    app.kubernetes.io/name: qopsec-rabbitmq
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: qopsec-rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qopsec-rabbitmq
  namespace: qopsec
spec:
  serviceName: qopsec-rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qopsec-rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qopsec-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: qopsec-secrets
                  key: QOPSEC_RABBITMQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: qopsec-secrets
                  key: QOPSEC_RABBITMQ_PASSWORD
          ports:
            - name: amqp
              containerPort: 5672
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 8Gi
