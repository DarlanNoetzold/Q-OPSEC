apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-adapter
  namespace: qopsec
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: qopsec-prometheus-adapter
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: qopsec-prometheus-adapter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: qopsec-prometheus-adapter
subjects:
  - kind: ServiceAccount
    name: prometheus-adapter
    namespace: qopsec
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-adapter-config
  namespace: qopsec
data:
  config.yaml: |
    externalRules:
      - seriesQuery: 'qopsec_pipeline_jobs_queued'
        resources:
          namespaced: false
        name:
          matches: "^(.*)$"
          as: "qopsec_pipeline_queue_depth"
        metricsQuery: 'sum(<<.Series>>{<<.LabelMatchers>>})'
      - seriesQuery: 'qopsec_jobs_queued'
        resources:
          namespaced: false
        name:
          matches: "^(.*)$"
          as: "qopsec_jobs_queue_depth"
        metricsQuery: 'sum(<<.Series>>{<<.LabelMatchers>>})'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-adapter
  namespace: qopsec
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus-adapter
    spec:
      serviceAccountName: prometheus-adapter
      containers:
        - name: prometheus-adapter
          image: registry.k8s.io/prometheus-adapter/prometheus-adapter:v0.11.2
          args:
            - --cert-dir=/tmp/cert
            - --secure-port=6443
            - --prometheus-url=http://prometheus.qopsec.svc:9090/
            - --metrics-relist-interval=30s
            - --config=/etc/adapter/config.yaml
            - --lister-kubeconfig=
          ports:
            - name: https
              containerPort: 6443
          volumeMounts:
            - name: config
              mountPath: /etc/adapter
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-adapter-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-adapter
  namespace: qopsec
spec:
  selector:
    app.kubernetes.io/name: prometheus-adapter
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta2.external.metrics.k8s.io
spec:
  service:
    name: prometheus-adapter
    namespace: qopsec
    port: 443
  group: external.metrics.k8s.io
  version: v1beta2
  insecureSkipTLSVerify: true
  groupPriorityMinimum: 100
  versionPriority: 100
