apiVersion: v1
kind: Service
metadata:
  name: qopsec-redis
  namespace: qopsec
  labels:
    app.kubernetes.io/name: qopsec-redis
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: qopsec-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qopsec-redis
  namespace: qopsec
spec:
  serviceName: qopsec-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qopsec-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qopsec-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7.4.3
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory-policy
            - allkeys-lru
            - --requirepass
            - $(QOPSEC_REDIS_PASSWORD)
          env:
            - name: QOPSEC_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qopsec-secrets
                  key: QOPSEC_REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$QOPSEC_REDIS_PASSWORD\" ping | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 8Gi
