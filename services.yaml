paths:
  conf_registry: ./confiability_service/model_registry
  datasets_dir: ./datasets
  logs_dir: ./logs
  model_registry: ./classify_scheduler/model_registry
  risk_registry: ./risk_service/model_registry
services:
  classification_agent:
    base_url: http://192.168.18.18:8088
    cwd: ./classification_agent
    env:
      CLASSIFY_API_KEY: your-api-key-for-authentication
    health: http://192.168.18.18:8088/api/v1/health
    metrics: http://127.0.0.1:9090/metrics
    pid_file: ./logs/classification_agent.pid
    port: 8088
    start:
    - python
    - main.py
    type: fastapi
  classify_scheduler:
    cwd: ./classify_scheduler
    env: {}
    health: ''
    log_file: ./logs/classify_scheduler.log
    pid_file: ./logs/classify_scheduler.pid
    start:
    - python
    - -m
    - main
    - --mode
    - train-once
    - --data
    - datasets/v1/context_dataset_advanced.csv
    - --registry
    - ./model_registry
    type: script
  confiability_service:
    base_url: http://192.168.18.18:8083
    cwd: ./confiability_service_v2
    env: {}
    health: http://127.0.0.1:8083/confidentiality/health
    log_file: ./logs/confiability_service_v2.log
    pid_file: ./logs/confiability_service_v2.pid
    port: 8083
    start:
    - python
    - app.py
    type: fastapi
  context_api:
    base_url: http://192.168.18.18:65534
    cwd: ./context_api
    env: {}
    health: http://127.0.0.1:65534/actuator/health
    log_file: ./logs/context_api.log
    pid_file: ./logs/context_api.pid
    port: 65534
    start:
    - mvn
    - spring-boot:run
    - -DskipTests
    type: spring
  crypto_module:
    base_url: http://192.168.18.18:8004
    cwd: ./crypto_module
    env: {}
    health: http://127.0.0.1:8004/health
    log_file: ./logs/crypto_module.log
    pid_file: ./logs/crypto_module.pid
    port: 8004
    start:
    - uvicorn
    - main:app
    - --host
    - 0.0.0.0
    - --port
    - '8004'
    type: fastapi
  dataset_extractor:
    cwd: ./dataset_extractor
    env: {}
    health: ''
    log_file: ./logs/dataset_extractor.log
    pid_file: ./logs/dataset_extractor.pid
    start:
    - python
    - main.py
    type: script
  handshake_negotiator:
    base_url: http://192.168.18.18:8001
    cwd: ./handshake_negotiator
    env: {}
    health: http://127.0.0.1:8001/docs
    log_file: ./logs/handshake_negotiator.log
    pid_file: ./logs/handshake_negotiator.pid
    port: 8001
    start:
    - uvicorn
    - main:app
    - --host
    - 0.0.0.0
    - --port
    - '8001'
    - --ws
    - none
    type: fastapi
  interceptor_api:
    base_url: http://127.0.0.1:8080
    cwd: ./interceptor_api
    env: {}
    health: http://127.0.0.1:8080/actuator/health
    log_file: ./logs/interceptor_api.log
    pid_file: ./logs/interceptor_api.pid
    port: 8080
    start:
    - mvn
    - spring-boot:run
    - -DskipTests
    type: spring
  key_destination_engine:
    base_url: http://127.0.0.1:8003
    cwd: ./key_destination_engine
    env: {}
    health: http://127.0.0.1:8003/health
    log_file: ./logs/key_destination_engine.log
    pid_file: ./logs/key_destination_engine.pid
    port: 8003
    start:
    - uvicorn
    - main:app
    - --host
    - 0.0.0.0
    - --port
    - '8003'
    type: fastapi
  kms_service:
    base_url: http://192.168.18.18:8002
    cwd: ./kms_service_v2
    env: {}
    health: http://127.0.0.1:8002/health
    log_file: ./logs/kms_service.log
    pid_file: ./logs/kms_service.pid
    port: 8002
    start:
    - uvicorn
    - main:app
    - --host
    - 0.0.0.0
    - --port
    - '8002'
    type: fastapi
  qopsec_redis:
    type: docker
    container_name: qopsec-redis
    image: redis:7.4.3
    ports:
    - 127.0.0.1:6380:6380
    volumes:
    - logs/qopsec-redis:/data
    env:
      REDIS_PASSWORD: ${QOPSEC_REDIS_PASSWORD}
    command:
    - redis-server
    - --port
    - "6380"
    - --appendonly
    - "yes"
    - --requirepass
    - ${QOPSEC_REDIS_PASSWORD}
    restart: unless-stopped
    labels:
    - com.qopsec.managed-by=orchestrator
  qopsec_rabbitmq:
    type: docker
    container_name: qopsec-rabbitmq
    image: rabbitmq:3.13-management
    ports:
    - 127.0.0.1:5673:5672
    - 127.0.0.1:15673:15672
    volumes:
    - logs/qopsec-rabbitmq:/var/lib/rabbitmq
    env:
      RABBITMQ_DEFAULT_USER: ${QOPSEC_RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${QOPSEC_RABBITMQ_PASSWORD}
    restart: unless-stopped
    health: http://127.0.0.1:15672/api/health/checks/alarms
    labels:
    - com.qopsec.managed-by=orchestrator
  qopsec_prometheus:
    type: docker
    container_name: qopsec-prom
    image: prom/prometheus
    ports:
    - 9091:9090
    volumes:
    - monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - logs/prometheus:/prometheus
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus]
    restart: unless-stopped
    health: http://127.0.0.1:9091/-/healthy
    labels:
    - com.qopsec.managed-by=orchestrator
  qopsec_grafana:
    type: docker
    container_name: qopsec-graf
    image: grafana/grafana
    ports:
    - 3001:3000
    volumes:
    - monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    - monitoring/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
    restart: unless-stopped
    health: http://127.0.0.1:3001/api/health
    env:
      GF_SERVER_HTTP_PORT: "3001"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_USERS_DEFAULT_THEME: dark
      GF_SECURITY_COOKIE_SAMESITE: none
    labels:
    - com.qopsec.managed-by=orchestrator
  risk_service:
    base_url: http://127.0.0.1:8000
    cwd: ./risk_service_V2
    env: {}
    health: http://127.0.0.1:8000/risk/health
    log_file: ./logs/risk_service_V2.log
    pid_file: ./logs/risk_service_V2.pid
    port: 8000
    start:
    - uvicorn
    - src.api.main:app
    - --reload
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    type: fastapi
  rl_engine:
    base_url: http://192.168.18.18:9009
    cwd: ./rl_engine
    env: {}
    health: http://127.0.0.1:9009/docs
    log_file: ./logs/rl_engine.log
    pid_file: ./logs/rl_engine.pid
    port: 9009
    start:
    - uvicorn
    - main:app
    - --host
    - 0.0.0.0
    - --port
    - '9009'
    type: fastapi
  validation_send_api:
    base_url: http://192.168.18.18:8005
    cwd: ./validation_send_api
    env: {}
    health: http://127.0.0.1:8005/actuator/health
    log_file: ./logs/validation_send_api.log
    pid_file: ./logs/validation_send_api.pid
    port: 8005
    start:
    - mvn
    - spring-boot:run
    - -DskipTests
    type: spring
startup_order:
- qopsec_redis
- qopsec_rabbitmq
- qopsec_prometheus
- qopsec_grafana
- kms_service
- key_destination_engine
- crypto_module
- validation_send_api
- handshake_negotiator
- risk_service
- confiability_service
- context_api
- classification_agent
- rl_engine
- interceptor_api
