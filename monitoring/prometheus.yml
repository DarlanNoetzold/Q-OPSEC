global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'q-opsec'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['192.168.18.18:8000']
        labels: {module: 'Risk-V2'}
      - targets: ['192.168.18.18:8001']
        labels: {module: 'Auth'}
      - targets: ['192.168.18.18:8002']
        labels: {module: 'KMS'}
      - targets: ['192.168.18.18:8003']
        labels: {module: 'KDE'}
      - targets: ['192.168.18.18:8004']
        labels: {module: 'Crypto'}
      - targets: ['192.168.18.18:8083']
        labels: {module: 'Confiability'}
      - targets: ['192.168.18.18:8088']
        labels: {module: 'RL-Engine'}
      - targets: ['192.168.18.18:8090']
        labels: {module: 'Orchestrator'}
      - targets: ['192.168.18.18:9009']
        labels: {module: 'Classification-Agent'}
  
  - job_name: 'q-opsec-java'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['192.168.18.18:65534']
        labels: {module: 'Context-API'}
